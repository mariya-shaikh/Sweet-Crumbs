<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Crumbs - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;
            color: #444;
        }

        header {
            background: #b45b76;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
        }

        button {
            background: #b45b76;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        header button {
            background: white;
            color: #b45b76;
        }

        .container {
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card, .section {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .stat-card h2 {
            color: #b45b76;
        }

        .section {
            margin-bottom: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #fff0f3;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Sweet Crumbs Admin</h1>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <h2>Welcome, Admin!</h2>

    <div class="stats">
        <div class="stat-card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">Loading...</h2>
        </div>

        <div class="stat-card">
            <h3>Total Feedback</h3>
            <h2 id="totalFeedback">Loading...</h2>
        </div>
    </div>

    <div class="section">
        <h2>Customer Orders</h2>
        <input
    type="text"
    id="orderSearch"
    placeholder="Search customer, mobile or cake..."
    style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:7px;"
>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Mobile</th>
                    <th>Cake</th>
                    <th>Price</th>
                    <th>Payment</th>
                    <th>Order Status</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
                <tr><td colspan="6">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Customer Feedback</h2>
        <input
    type="text"
    id="feedbackSearch"
    placeholder="Search customer, rating or message..."
    style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:7px;"
>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Rating</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="feedbackTable">
                <tr><td colspan="4">Loading feedback...</td></tr>
            </tbody>
        </table>
    </div>

</div>
<script>
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

async function checkAdmin() {
    try {
        const response = await fetch("/api/admin/check");
        const result = await response.json();

        if (!result.loggedIn) {
            window.location.href = "/admin/login.html";
            return;
        }

        loadOrders();
        loadFeedback();

    } catch (error) {
        alert("Could not verify admin login.");
        window.location.href = "/admin/login.html";
    }
}

async function loadOrders() {
    try {
        const response = await fetch("/api/admin/orders");

        if (!response.ok) throw new Error("Orders could not load.");

        const orders = await response.json();

        document.getElementById("totalOrders").innerText = orders.length;

        const table = document.getElementById("ordersTable");

        if (orders.length === 0) {
            table.innerHTML = '<tr><td colspan="6">No orders found.</td></tr>';
            return;
        }

        table.innerHTML = orders.map(order => `
            <tr>
                <td>${escapeHTML(order.id)}</td>
                <td>${escapeHTML(order.customer_name)}</td>
                <td>${escapeHTML(order.mobile)}</td>
                <td>${escapeHTML(order.cake_name)}</td>
                <td>₹${escapeHTML(order.price)}</td>
                <td>${escapeHTML(order.payment_method)}</td>
                <td>
    <select onchange="updateOrderStatus(${Number(order.id)}, this.value)">
        <option value="Pending" ${order.order_status === "Pending" ? "selected" : ""}>Pending</option>
        <option value="Confirmed" ${order.order_status === "Confirmed" ? "selected" : ""}>Confirmed</option>
        <option value="Preparing" ${order.order_status === "Preparing" ? "selected" : ""}>Preparing</option>
        <option value="Delivered" ${order.order_status === "Delivered" ? "selected" : ""}>Delivered</option>
    </select>
</td>
            </tr>
        `).join("");

    } catch (error) {
        document.getElementById("ordersTable").innerHTML =
            '<tr><td colspan="6">Could not load orders.</td></tr>';
    }
}

async function loadFeedback() {
    try {
        const response = await fetch("/api/admin/feedback");

        if (!response.ok) throw new Error("Feedback could not load.");

        const feedback = await response.json();

        document.getElementById("totalFeedback").innerText = feedback.length;

        const table = document.getElementById("feedbackTable");

        if (feedback.length === 0) {
            table.innerHTML = '<tr><td colspan="4">No feedback found.</td></tr>';
            return;
        }

        table.innerHTML = feedback.map(item => `
            <tr>
                <td>${escapeHTML(item.id)}</td>
                <td>${escapeHTML(item.customer_name)}</td>
                <td>${escapeHTML(item.rating)}</td>
                <td>${escapeHTML(item.message)}</td>
            </tr>
        `).join("");

    } catch (error) {
        document.getElementById("feedbackTable").innerHTML =
            '<tr><td colspan="4">Could not load feedback.</td></tr>';
    }
}

async function logout() {
    await fetch("/api/admin/logout", { method: "POST" });
    window.location.href = "/admin/login.html";
}
/* ORDER SEARCH */
document.getElementById("orderSearch").addEventListener("input", function() {
    const searchValue = this.value.toLowerCase();

    document.querySelectorAll("#ordersTable tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(searchValue)
            ? ""
            : "none";
    });
});

/* FEEDBACK SEARCH */
document.getElementById("feedbackSearch").addEventListener("input", function() {
    const searchValue = this.value.toLowerCase();

    document.querySelectorAll("#feedbackTable tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(searchValue)
            ? ""
            : "none";
    });
});
async function updateOrderStatus(id, status) {
    try {
        const response = await fetch(`/api/admin/orders/${id}/status`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ status: status })
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message);
            return;
        }

        alert("Order status updated successfully!");
    } catch (error) {
        alert("Something went wrong!");
    }
}
checkAdmin();
</script>

</body>
</html>
